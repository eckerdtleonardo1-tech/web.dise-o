 <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <title>Anotador de Truco</title>
      
      <!-- Tailwind CSS via CDN -->
      <script src="https://cdn.tailwindcss.com"></script>
      <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: { background: '#09090b' }
            }
          }
        }
      </script>
    
      <!-- React & ReactDOM -->
      <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
      <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
      
      <!-- Babel for parsing JSX -->
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
      <style>
        body { background-color: #09090b; color: #f4f4f5; }
        /* Prevenir zoom accidental en móviles al tocar rápido */
        input, button { touch-action: manipulation; }
      </style>
    </head>
    <body class="antialiased select-none">
      <div id="root"></div>
    
      <script type="text/babel">
        const { useState } = React;
    
        // --- Íconos integrados en formato SVG ---
        const Plus = ({ size = 20 }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
  strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19"
  y2="12"></line></svg>
        );
        const Minus = ({ size = 20 }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
  strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const RotateCcw = ({ size = 16 }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
  strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 
  2.13-9.36L1 10"></path></svg>
        );
        const Trophy = ({ size = 40, className = "" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
  stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path
  d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7
  22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12
  0V2Z"></path></svg>
        );
        const Edit2 = ({ size = 14, className = "" }) => (
          <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
  stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2
  22l1.5-5.5L17 3z"></path></svg>
        );
        const Check = ({ size = 18 }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
  strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
    
        const TEAM_1_DEFAULT = "Nosotros";
        const TEAM_2_DEFAULT = "Ellos";
    
        function TrucoScoreboard() {
          const [team1, setTeam1] = useState(TEAM_1_DEFAULT);
          const [team2, setTeam2] = useState(TEAM_2_DEFAULT);
          
          const [score1, setScore1] = useState(0);
          const [score2, setScore2] = useState(0);
          
          const [limit, setLimit] = useState(30);
          const [winner, setWinner] = useState(null);
    
          const [editingTeam, setEditingTeam] = useState(null);
          const [tempName, setTempName] = useState("");
    
          const handleScoreChange = (team, amount) => {
            if (winner) return;
    
            if (team === 1) {
              const newScore = Math.max(0, score1 + amount);
              if (newScore >= limit) {
                setScore1(limit);
                setWinner(team1);
              } else {
                setScore1(newScore);
              }
            } else {
              const newScore = Math.max(0, score2 + amount);
              if (newScore >= limit) {
                setScore2(limit);
                setWinner(team2);
              } else {
                setScore2(newScore);
              }
            }
          };
    
          const resetGame = () => {
            setScore1(0);
            setScore2(0);
            setWinner(null);
          };
    
          const startEditing = (teamId, currentName) => {
            setEditingTeam(teamId);
            setTempName(currentName);
          };
    
          const saveTeamName = () => {
            if (editingTeam === 1) {
              setTeam1(tempName.trim() || TEAM_1_DEFAULT);
            } else {
              setTeam2(tempName.trim() || TEAM_2_DEFAULT);
            }
            setEditingTeam(null);
          };
    
          const getPhase = (score) => {
            if (limit === 15) return "Puntos";
            return score < 15 ? "Malas" : "Buenas";
          };
    
          const getPhaseScore = (score) => {
            if (limit === 15) return score;
            return score <= 15 ? score : score - 15;
          };
    
          const renderTeamName = (teamId, name) => {
            if (editingTeam === teamId) {
              return (
                <div className="flex items-center gap-2 justify-center h-[32px]">
                  <input
                    type="text"
                    className="bg-zinc-800 text-zinc-100 border border-blue-500/50 rounded px-2 py-1 w-24 text-center focus:outline-none
  focus:ring-2 focus:ring-blue-500 text-sm font-bold"
                    value={tempName}
                    onChange={(e) => setTempName(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && saveTeamName()}
                    autoFocus
                    maxLength={12}
                  <button onClick={saveTeamName} className="text-blue-400 hover:text-blue-300 transition-colors">
                  />
                    <Check size={18} />
                  </button>
                </div>
              );
            }
    
            return (
              <div 
                className="flex items-center gap-2 justify-center group cursor-pointer h-[32px]"
                onClick={() => startEditing(teamId, name)}
                title="Editar nombre"
              >
                <h2 className="text-xl font-bold tracking-wide text-zinc-100 truncate max-w-[100px] sm:max-w-[120px]">{name}</h2>
                <Edit2 size={14} className="text-zinc-600 group-hover:text-blue-400 transition-colors opacity-0 group-hover:opacity-100
  hidden sm:block" />
              </div>
            );
          };
    
          return (
            <div className="min-h-screen bg-[#09090b] text-zinc-100 flex flex-col items-center justify-center py-4 px-4 font-sans
  relative overflow-hidden">
              
              <div className="flex items-center gap-4 mb-6 bg-zinc-900/80 px-5 py-2 rounded-2xl border border-zinc-800 shadow-xl
  backdrop-blur-sm z-10">
                <span className="text-xs sm:text-sm font-medium text-zinc-400 uppercase tracking-wider">A jugar a:</span>
                <div className="flex bg-zinc-800/80 rounded-lg p-1">
                  <button
                    onClick={() => { setLimit(15); resetGame(); }}
                    className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${limit === 15 ? 'bg-blue-600 text-white shadow-
  md' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-700'}`}
                  >
                    15
                  </button>
                  <button
                    onClick={() => { setLimit(30); resetGame(); }}
                    className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${limit === 30 ? 'bg-blue-600 text-white shadow-
  md' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-700'}`}
                  >
                    30
                  </button>
                </div>
              </div>
    
              <div className="flex w-full max-w-md bg-zinc-900/60 rounded-[2rem] p-4 sm:p-6 shadow-2xl border border-zinc-800/50
  relative z-10 backdrop-blur-md">
                
                <div className="absolute left-1/2 top-8 bottom-8 w-[2px] bg-gradient-to-b from-zinc-800/0 via-zinc-800 to-zinc-800/0 -
  translate-x-1/2 rounded-full hidden sm:block"></div>
                <div className="absolute left-1/2 top-8 bottom-8 w-[1px] bg-zinc-800 -translate-x-1/2 rounded-full sm:hidden"></div>
    
                <div className="flex-1 flex flex-col items-center pr-2 sm:pr-4">
                  {renderTeamName(1, team1)}
                  
                  <div className="mt-6 sm:mt-8 mb-2 relative flex flex-col items-center">
                     <div className="text-[4rem] sm:text-[5rem] leading-none font-black text-transparent bg-clip-text bg-gradient-to-br
  from-white to-zinc-400 tracking-tighter tabular-nums drop-shadow-sm h-[4rem] sm:h-[5rem] flex items-center justify-center">
                        {getPhaseScore(score1)}
                     </div>
                     <span className="text-[10px] sm:text-xs font-medium text-blue-500/80 uppercase tracking-[0.2em] mt-2 sm:mt-4 h-4">
                        {getPhase(score1)}
                     </span>
                  </div>
    
                  <div className="flex flex-col gap-2 sm:gap-3 w-full mt-6 sm:mt-8">
                    <div className="flex gap-2">
                      <button onClick={() => handleScoreChange(1, -1)} disabled={score1 === 0} className="flex-1 flex justify-center
  items-center py-3 sm:py-4 bg-zinc-800/80 hover:bg-zinc-700 rounded-xl sm:rounded-2xl text-zinc-400 hover:text-white transition-all
  active:scale-95 disabled:opacity-50 disabled:active:scale-100 disabled:hover:bg-zinc-800 border border-zinc-700/50 touch-
  manipulation">
                        <Minus size={20} />
                      </button>
                      <button onClick={() => handleScoreChange(1, 1)} className="flex-1 flex justify-center items-center py-3 sm:py-4 
  bg-blue-600 hover:bg-blue-500 rounded-xl sm:rounded-2xl text-white shadow-[0_0_15px_-5px_rgba(37,99,235,0.4)] transition-all
  active:scale-95 border border-blue-400/20 touch-manipulation">
                        <Plus size={20} />
                      </button>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => handleScoreChange(1, 2)} className="flex-1 py-2 sm:py-3 bg-zinc-800 hover:bg-zinc-700
  rounded-lg sm:rounded-xl text-blue-400 font-bold text-sm sm:text-lg transition-all active:scale-95 border border-zinc-700/50
  hover:border-blue-500/30 touch-manipulation">
                        +2
                      </button>
                      <button onClick={() => handleScoreChange(1, 3)} className="flex-1 py-2 sm:py-3 bg-zinc-800 hover:bg-zinc-700
  rounded-lg sm:rounded-xl text-blue-400 font-bold text-sm sm:text-lg transition-all active:scale-95 border border-zinc-700/50
  hover:border-blue-500/30 touch-manipulation">
                        +3
                      </button>
                    </div>
                  </div>
                </div>
    
                <div className="flex-1 flex flex-col items-center pl-2 sm:pl-4">
                  {renderTeamName(2, team2)}
                  
                  <div className="mt-6 sm:mt-8 mb-2 relative flex flex-col items-center">
                     <div className="text-[4rem] sm:text-[5rem] leading-none font-black text-transparent bg-clip-text bg-gradient-to-br
  from-white to-zinc-400 tracking-tighter tabular-nums drop-shadow-sm h-[4rem] sm:h-[5rem] flex items-center justify-center">
                        {getPhaseScore(score2)}
                     </div>
                     <span className="text-[10px] sm:text-xs font-medium text-blue-500/80 uppercase tracking-[0.2em] mt-2 sm:mt-4 h-4">
                        {getPhase(score2)}
                     </span>
                  </div>
    
                  <div className="flex flex-col gap-2 sm:gap-3 w-full mt-6 sm:mt-8">
                    <div className="flex gap-2">
                      <button onClick={() => handleScoreChange(2, -1)} disabled={score2 === 0} className="flex-1 flex justify-center
  items-center py-3 sm:py-4 bg-zinc-800/80 hover:bg-zinc-700 rounded-xl sm:rounded-2xl text-zinc-400 hover:text-white transition-all
  active:scale-95 disabled:opacity-50 disabled:active:scale-100 disabled:hover:bg-zinc-800 border border-zinc-700/50 touch-
  manipulation">
                        <Minus size={20} />
                      </button>
                      <button onClick={() => handleScoreChange(2, 1)} className="flex-1 flex justify-center items-center py-3 sm:py-4 
  bg-blue-600 hover:bg-blue-500 rounded-xl sm:rounded-2xl text-white shadow-[0_0_15px_-5px_rgba(37,99,235,0.4)] transition-all
  active:scale-95 border border-blue-400/20 touch-manipulation">
                        <Plus size={20} />
                      </button>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => handleScoreChange(2, 2)} className="flex-1 py-2 sm:py-3 bg-zinc-800 hover:bg-zinc-700
  rounded-lg sm:rounded-xl text-blue-400 font-bold text-sm sm:text-lg transition-all active:scale-95 border border-zinc-700/50
  hover:border-blue-500/30 touch-manipulation">
                        +2
                      </button>
                      <button onClick={() => handleScoreChange(2, 3)} className="flex-1 py-2 sm:py-3 bg-zinc-800 hover:bg-zinc-700
  rounded-lg sm:rounded-xl text-blue-400 font-bold text-sm sm:text-lg transition-all active:scale-95 border border-zinc-700/50
  hover:border-blue-500/30 touch-manipulation">
                        +3
                      </button>
                    </div>
                  </div>
                </div>
    
              </div>
    
              <button 
                onClick={resetGame}
                className="mt-8 flex items-center gap-2 text-zinc-500 hover:text-zinc-300 transition-colors py-2 px-4 rounded-full
  hover:bg-zinc-900/50 touch-manipulation"
              >
                <RotateCcw size={16} />
                <span className="text-sm font-medium">Reiniciar Partida</span>
              </button>
    
              {winner && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-zinc-900 border border-zinc-800 rounded-[2rem] p-8 max-w-[320px] sm:max-w-sm w-full shadow-2xl flex
  flex-col items-center animate-in fade-in zoom-in duration-300">
                    <div className="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center mb-6 border border-blue-
  500/20">
                      <Trophy size={40} className="text-blue-500 drop-shadow-[0_0_15px_rgba(37,99,235,0.5)]" />
                    </div>
                    <h2 className="text-3xl font-black text-white mb-2 text-center">¡Ganaron!</h2>
                    <p className="text-xl text-blue-400 font-bold mb-8 text-center bg-blue-500/10 px-6 py-2 rounded-full border border-
  blue-500/20">
                      {winner}
                    </p>
                    <button 
                      onClick={resetGame}
                      className="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl text-white font-bold text-lg shadow-[0_0_20px_-
  5px_rgba(37,99,235,0.4)] transition-all active:scale-95 flex items-center justify-center gap-2 touch-manipulation"
                    >
                      <RotateCcw size={20} />
                      Jugar de nuevo
                    </button>
                  </div>
                </div>
              )}
    
            </div>
          );
        }
    
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TrucoScoreboard />);
      </script>
    </body>
    </html>
